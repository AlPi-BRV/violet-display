; Violet Pool-Display – Elecrow CrowPanel 5" (DIS07050H, V3.0, ESP32-S3-WROOM-1-N4R8)
[env:crowpanel5]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; zwei Programmbereiche (je 1,9 MB) fuer Updates ueber WLAN;
; die Einstellungen (NVS) liegen an derselben Stelle wie vorher und bleiben erhalten
board_build.partitions = min_spiffs.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.1.8
    bblanchon/ArduinoJson@^7.0.4
